[Settings]
; 邊框顏色 (Hex 色碼，8cf287 為 PowerToys 綠色, ff0000 為紅色)
BorderColor = 8cf287

; 邊框粗細 (像素 px)
BorderThickness = 3

; 圓角半徑 (像素 px)
CornerRadius = 10

; 目標視窗不透明度 (0 = 完全透明, 255 = 100% 不透明，建議設為 180 ~ 220 呈現半透明效果)
TargetOpacity = 220

; 邊框位置微調 (像素 px)
OffsetX = 0
OffsetY = 0
OffsetW = 0
OffsetH = 0
